services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network Postgres is reachable at host "postgres".
      DATABASE_URL: "postgresql://ledger:ledger@postgres:5432/ledger?schema=public"
      # Seed the demo user on boot. Set to "false" to start empty.
      SEED: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
